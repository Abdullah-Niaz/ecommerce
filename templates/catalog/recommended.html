{% extends "catalog/base.html" %}
{% block title %}Recommended Products{% endblock %}
{% block content %}
<h2>Recommended for You</h2>
<ul>
    {% for product in recommended %}
    <li>{{ product.title }} - ${{ product.price }}</li>
    {% empty %}
    <li>No recommendations yet.</li>
    {% endfor %}
</ul>
{% endblock %}
